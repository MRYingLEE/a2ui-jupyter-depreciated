[project]
name = "a2ui-form"
version = "0.1.0"
description = "Ask for feedback with an A2UI form over Jupyter stdin"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["a2ui", "jupyter", "jupyterlite", "input", "form"]
dependencies = []

[project.urls]
Homepage = "https://a2ui.org/"
Repository = "https://github.com/a2ui-project/a2ui/tree/main/python/a2ui_form"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2ui_form"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]
