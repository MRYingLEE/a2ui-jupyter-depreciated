name: TestPyPI release a2ui-jupyter

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pypi-test-a2ui-jupyter
  cancel-in-progress: false

jobs:
  build:
    name: Build a2ui-jupyter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"

      - name: Build distributions
        working-directory: python/a2ui_jupyter
        run: uv build --out-dir dist

      - name: Check distribution metadata
        working-directory: python/a2ui_jupyter
        run: uv run --isolated --with twine twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a2ui-jupyter-testpypi
          path: python/a2ui_jupyter/dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: a2ui-jupyter-testpypi
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
